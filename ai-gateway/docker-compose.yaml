services:
  kong:
    image: kong/kong-gateway:3.13
    hostname: kong
    # container_name: kong
    ports:
      - "8000:8000"
      - "8001:8001"
      - "8002:8002"
    volumes:
        - ./kong-config/:/kong/declarative/
    environment:
        - KONG_DATABASE=off
        - KONG_DECLARATIVE_CONFIG=/kong/declarative/kong.yaml
        - KONG_PROXY_ACCESS_LOG=/dev/stdout
        - KONG_ADMIN_ACCESS_LOG=/dev/stdout
        - KONG_PROXY_ERROR_LOG=/dev/stderr
        - KONG_ADMIN_ERROR_LOG=/dev/stderr
        - KONG_ADMIN_LISTEN=0.0.0.0:8001
        - KONG_ADMIN_GUI_URL=http://localhost:8002
        - KONG_LICENSE_DATA
        # Required so the declarative config's {vault://env/OPENAI_API_KEY}
        # reference can resolve — Kong's built-in "env" vault backend reads
        # this process environment variable at startup/reference time.
        - OPENAI_API_KEY
        # - KONG_LOG_LEVEL=debug
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:7.4.0-v0
    # container_name: redis
    hostname: redis
    ports:
      - "6379:6379"
    restart: unless-stopped
