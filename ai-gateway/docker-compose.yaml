name: ai_gateway

services:
  # Kong Gateway data-plane node, hybrid mode, connected to the `ai-gateway`
  # Konnect control plane (provisioned via kongctl — see kongctl/README.md).
  # Services/routes/plugins are pushed from Konnect via decK
  # (`kongctl apply -f kongctl/config.yaml`), not loaded from a local
  # declarative file. Konnect also handles Enterprise licensing for
  # connected data planes, so no KONG_LICENSE_DATA is needed here.
  kong:
    image: kong/kong-gateway:3.15
    container_name: ai-gateway-kong
    hostname: kong
    restart: unless-stopped
    ports:
      - "8000:8000"   # HTTP proxy (ai-proxy /chat route)
      - "8443:8443"   # HTTPS proxy
      - "8001:8001"   # local Admin API — read-only reflection of the Konnect-pushed config
    volumes:
      - ./kongctl/certs:/etc/kong/certs:ro
    env_file:
      - konnect.env
    environment:
      - KONG_ROLE=data_plane
      - KONG_DATABASE=off
      - KONG_VITALS=off
      - KONG_CLUSTER_MTLS=pki
      - KONG_CLUSTER_CERT=/etc/kong/certs/tls.crt
      - KONG_CLUSTER_CERT_KEY=/etc/kong/certs/tls.key
      - KONG_LUA_SSL_TRUSTED_CERTIFICATE=system
      - KONG_KONNECT_MODE=on
      - KONG_ADMIN_LISTEN=0.0.0.0:8001
      - KONG_PROXY_ACCESS_LOG=/dev/stdout
      - KONG_PROXY_ERROR_LOG=/dev/stderr
      - KONG_ADMIN_ACCESS_LOG=/dev/stdout
      - KONG_ADMIN_ERROR_LOG=/dev/stderr
      - KONG_ROUTER_FLAVOR=expressions
    depends_on:
      - redis

  redis:
    image: redis/redis-stack:7.4.0-v0
    container_name: ai-gateway-redis
    hostname: redis
    restart: unless-stopped
    ports:
      - "6379:6379"
