_format_version: "3.0"

services:
- name: ai-gw
  tags:
  - event-driven-ai-patterns
  # Upstream is unused directly by ai-proxy (which overrides the request
  # target based on model.options.upstream_url below) but Kong still
  # requires a service url to be configured.
  url: https://api.openai.com
  routes:
  - name: chat
    tags:
    - event-driven-ai-patterns
    paths:
    - /chat
    plugins:
    - name: ai-proxy
      config:
        route_type: "llm/v1/chat"
        auth:
          header_name: "Authorization"
          header_value: "{vault://env/OPENAI_API_KEY}"
        model:
          provider: "openai"
          name: "gpt-4o-mini"
          options:
            max_tokens: 512
            temperature: 1.0
        max_request_body_size: 524288

    - name: ai-rag-injector
      config:
        inject_template: |
          Only use the following information surrounded by <CONTEXT></CONTEXT> and your existing knowledge to provide the best possible answer to the user.
          <CONTEXT><RAG RESPONSE></CONTEXT>
          User's question: <PROMPT>
        embeddings:
          auth:
            header_name: "Authorization"
            header_value: "{vault://env/OPENAI_API_KEY}"
          model:
            provider: openai
            name: text-embedding-3-large
        vectordb:
          strategy: redis
          redis:
            host: redis
            port: 6379
          distance_metric: cosine
          dimensions: 3072

    - name: cors
      config:
        methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
        - PATCH
        - TRACE
        - CONNECT
        origins:
        - '*'
