# ============================================================================
# Data Plane Certificate — ai-gateway control plane
#
# NOTE: Generate the certificate before applying. Kong Gateway's hybrid-mode
# clustering cert convention uses an EC key (matching the official "Run Kong
# Gateway in Hybrid mode" guide):
#
#   mkdir -p kongctl/certs
#   openssl req -new -x509 -nodes -newkey ec:<(openssl ecparam -name secp384r1) \
#     -keyout kongctl/certs/tls.key \
#     -out    kongctl/certs/tls.crt \
#     -days 1095 -subj "/CN=kong_clustering"
#
# The private key (tls.key) stays local — only tls.crt is uploaded to Konnect.
#
# Apply:
#   export KONGCTL_DEFAULT_KONNECT_PAT=<your-personal-access-token>
#   kongctl apply -f kongctl/data_plane_certificate.yaml
# ============================================================================

_defaults:
  kongctl:
    namespace: event-driven-ai-patterns

control_planes:
  - ref: ai-gateway-cp
    name: ai-gateway
    description: Event-Driven AI Patterns Demo — The Oracle (CDC-to-RAG) AI Gateway
    cluster_type: CLUSTER_TYPE_CONTROL_PLANE
    labels:
      env: demo
      project: event-driven-ai-patterns
    data_plane_certificates:
      - ref: ai-gateway-dp-cert
        cert: !file ./certs/tls.crt
