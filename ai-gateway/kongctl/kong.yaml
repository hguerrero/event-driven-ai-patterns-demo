# ============================================================================
# decK state file — pushed to the `ai-gateway` Konnect control plane by
# kongctl's `_deck` integration (see ../kongctl/config.yaml). This is the
# same Kong declarative format used for self-hosted Kong Gateway; kongctl
# runs `deck gateway apply` against the Konnect control plane on your
# behalf, and Konnect replicates the resulting config down to any connected
# data-plane nodes (see ../docker-compose.yaml).
#
# `select_tags` / `tags` scope this file's ownership so a future
# `kongctl sync` only manages the resources tagged here, matching the
# `_deck.flags: [--select-tag=...]` set in ../kongctl/config.yaml.
# ============================================================================
_format_version: "3.0"
_info:
  select_tags:
    - event-driven-ai-patterns

services:
- name: ai-gw
  tags:
  - event-driven-ai-patterns
  # Upstream is unused directly by ai-proxy (which overrides the request
  # target based on model.options.upstream_url below) but Kong still
  # requires a service url to be configured.
  url: https://api.openai.com
  routes:
  - name: chat
    tags:
    - event-driven-ai-patterns
    paths:
    - /chat
    plugins:
    - name: ai-proxy
      config:
        route_type: "llm/v1/chat"
        auth:
          header_name: "Authorization"
          header_value: "Bearer {vault://env/OPENAI_API_KEY}"
        model:
          provider: "openai"
          name: "gpt-4o-mini"
          options:
            max_tokens: 1024
            temperature: 0.5
            upstream_url: https://api.openai.com/v1/chat/completions

    - name: ai-rag-injector
      config:
        inject_template: |
          Only use the following information surrounded by <CONTEXT></CONTEXT> and your existing knowledge to provide the best possible answer to the user.
          <CONTEXT><RAG RESPONSE></CONTEXT>
          User's question: <PROMPT>
        embeddings:
          auth:
            header_name: "Authorization"
            header_value: "Bearer {vault://env/OPENAI_API_KEY}"
          model:
            provider: openai
            name: text-embedding-3-small
            options:
              upstream_url: https://api.openai.com/v1/embeddings
        vectordb:
          strategy: redis
          redis:
            host: redis
            port: 6379
          distance_metric: cosine
          dimensions: 1536

    - name: cors
      config:
        methods:
        - GET
        - POST
        - PUT
        - DELETE
        - OPTIONS
        - HEAD
        - PATCH
        - TRACE
        - CONNECT
        origins:
        - '*'
